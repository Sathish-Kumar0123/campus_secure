{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4"><h2 class="mb-3">Welcome back</h2><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autocomplete="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100">Login</button></form><p class="small text-secondary mt-3 mb-0">Student? <a href="{% url 'register' %}">Create an account</a></p></div></div></div>{% endblock %}
