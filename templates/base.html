<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}College Portal{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb;color:#182230}.navbar{background:#10243a}.card{border:0;box-shadow:0 8px 24px #10243a12;border-radius:14px}.btn-primary{background:#176b87;border-color:#176b87}.container{max-width:1100px}.brand-dot{color:#69d2e7}</style>
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'home' %}">Campus<span class="brand-dot">Secure</span></a>
<div class="ms-auto d-flex gap-3 align-items-center">{% if user.is_authenticated %}<a class="text-white text-decoration-none" href="{% url 'dashboard' %}">Dashboard</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button></form>{% else %}<a class="text-white" href="{% url 'login' %}">Login</a><a class="btn btn-sm btn-info" href="{% url 'register' %}">Student register</a>{% endif %}</div></div></nav>
<main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
<footer class="text-center text-secondary small py-4">Secure College Academic Portal · Django sessions · Role-based access</footer>
</body></html>
