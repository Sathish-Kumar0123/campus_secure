{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><h2 class="mb-3">{{ title }}</h2><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Submit</button></form></div></div></div><script>document.querySelectorAll('input,select,textarea').forEach(e=>{if(!e.classList.contains('form-control')&&!e.classList.contains('form-select'))e.classList.add(e.tagName==='SELECT'?'form-select':'form-control')})</script>{% endblock %}
